name: publish

# Publish every package under agents/ on push to main: registry agents to
# /v1/agents, app templates (kind "app") to /v1/agent-templates. Idempotent: an
# id@version whose digest already matches is skipped; a changed digest on an
# existing version is a HARD failure (immutability — bump the version in
# agent.json). Pull requests run the tests and offline validation only.
# See docs: dough-gateway/docs/design/agent-packages.md §2.
#
# Secrets: DOUGH_GATEWAY_URL, AGENT_REGISTRY_PUBLISH_TOKEN (operator token).

on:
  push:
    branches: [main]
  pull_request:
  # Allow re-running the publish manually (e.g. after adding a registry secret).
  workflow_dispatch:

jobs:
  test-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.4'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun test

      - name: Validate all packages (offline)
        run: bun bin/publish.ts validate agents/*

      - name: Publish all packages
        if: github.event_name != 'pull_request'
        env:
          DOUGH_GATEWAY_URL: ${{ secrets.DOUGH_GATEWAY_URL }}
          AGENT_REGISTRY_PUBLISH_TOKEN: ${{ secrets.AGENT_REGISTRY_PUBLISH_TOKEN }}
        run: bun bin/publish.ts publish agents/*
